  <text class="gain" x="519" y="152" text-anchor="middle">+3.5</text>
  <text class="total" x="519" y="121" text-anchor="middle">78.2</text>

  <!-- Gemini 4 Argon: 82.2 + 0.8 = 83.0 -->
