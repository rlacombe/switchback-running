  <path d="M68 326 L76 318 M68 334 L76 326"
        fill="none" stroke="#52525b" stroke-width="1.2"
        stroke-linecap="square"/>

  <!-- The aggregate is separated without adding a filled background. -->
  <rect x="663" y="10" width="98" height="415" fill="none" stroke="#FF681F" stroke-width="1.1" stroke-dasharray="5 4"/>

  <g>
  <!-- Claude Sonnet 5: 69.5 + 4.3 = 73.8 -->
  <rect x="104" y="203.0" width="58" height="157.0" fill="#272732" stroke="#3f3f4e" stroke-width="0.8"/>
  <rect x="104" y="168.8" width="58" height="34.2" fill="#FF681F"/>
  <line x1="104" y1="203.0" x2="162" y2="203.0" stroke="#0a0a0a" stroke-width="1.0"/>
  <text class="raw-value" x="133" y="222" text-anchor="middle">69.5</text>
  <text class="gain" x="133" y="190" text-anchor="middle">+4.3</text>
  <text class="total" x="133" y="157" text-anchor="middle">73.8</text>

  <!-- Claude Opus 5: 67.8 + 12.3 = 80.1 -->
  <rect x="178" y="216.4" width="58" height="143.6" fill="#272732" stroke="#3f3f4e" stroke-width="0.8"/>
  <rect x="178" y="117.8" width="58" height="98.6" fill="#FF681F"/>
  <line x1="178" y1="216.4" x2="236" y2="216.4" stroke="#0a0a0a" stroke-width="1.0"/>
  <text class="raw-value" x="207" y="235" text-anchor="middle">67.8</text>
  <text class="gain" x="207" y="171" text-anchor="middle">+12.3</text>
  <text class="total" x="207" y="106" text-anchor="middle">80.1</text>
  </g>

  <g>
  <!-- GPT-5.6 Terra: 71.0 + 8.6 = 79.5 (reported values). -->
