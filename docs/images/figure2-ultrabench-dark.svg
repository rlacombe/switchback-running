  <text class="raw-value" x="326" y="210" text-anchor="middle">71.0</text>
  <text class="gain" x="326" y="161" text-anchor="middle">+8.6</text>
  <text class="total" x="326" y="110" text-anchor="middle">79.5</text>

  <!-- GPT-5.6 Sol: 75.5 + 7.8 = 83.3 -->
  <rect x="371" y="154.8" width="58" height="205.2" fill="#272732" stroke="#3f3f4e" stroke-width="0.8"/>
  <rect x="371" y="92.3" width="58" height="62.5" fill="#FF681F"/>
  <line x1="371" y1="154.8" x2="429" y2="154.8" stroke="#0a0a0a" stroke-width="1.0"/>
  <text class="raw-value" x="400" y="174" text-anchor="middle">75.5</text>
  <text class="gain" x="400" y="128" text-anchor="middle">+7.8</text>
  <text class="total" x="400" y="80" text-anchor="middle">83.3</text>
  </g>

  <g>
  <!-- Gemini 3.8 Flash: 74.6 + 3.5 = 78.2 -->
  <rect x="490" y="161.7" width="58" height="198.3" fill="#272732" stroke="#3f3f4e" stroke-width="0.8"/>
  <rect x="490" y="133.4" width="58" height="28.3" fill="#FF681F"/>
  <line x1="490" y1="161.7" x2="548" y2="161.7" stroke="#0a0a0a" stroke-width="1.0"/>
