    <text x="62" y="283.5">60</text>
    <text x="62" y="203">70</text>
    <text x="62" y="122.5">80</text>
    <text x="62" y="42">90</text>
  </g>
  <text class="axis-title" transform="translate(19 199) rotate(-90)" text-anchor="middle">UltraBench score</text>

  <!-- Truncated-axis break between the zero baseline and the first visible tick. -->
  <line x1="72" y1="38" x2="72" y2="317" stroke="#52525b" stroke-width="1.2"/>
  <line x1="72" y1="335" x2="72" y2="360" stroke="#52525b" stroke-width="1.2"/>
