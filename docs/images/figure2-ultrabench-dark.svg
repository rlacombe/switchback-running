<svg xmlns="http://www.w3.org/2000/svg" width="840" height="460" viewBox="0 0 840 460">
  <rect width="840" height="460" fill="#0a0a0a"/>
  <style>
    text { font-family: Barlow; }
    .title { fill: #f5f5f5; font-size: 15.5px; font-weight: 600; }
    .legend { fill: #dddddd; font-size: 14px; }
    .axis { fill: #999999; font-size: 13px; }
    .axis-title { fill: #dddddd; font-size: 14px; font-weight: 600; }
    .model { fill: #f5f5f5; font-size: 14.5px; font-weight: 600; }
    .raw-value { fill: #FFFFFF; font-size: 13px; font-weight: 600; }
    .gain { fill: #FFFFFF; font-size: 11.5px; font-weight: 600; }
    .total { fill: #ff6b2b; font-size: 13px; font-weight: 600; }
    .group { fill: #a1a1aa; font-size: 11px; font-weight: 600; }
  </style>


  <!-- Provider and aggregate labels. -->
  <g class="group" text-anchor="middle">
    <text x="170" y="25"><tspan>Claude Code</tspan><tspan dx="6">(Anthropic)</tspan></text>
    <text x="363" y="25"><tspan>Codex</tspan><tspan dx="6">(OpenAI)</tspan></text>
    <text x="556" y="25"><tspan>Antigravity</tspan><tspan dx="6">(Google)</tspan></text>
    <text x="712" y="25">All agents</text>
  </g>

  <!-- Plot area: y=50 at 360; y=90 at 38. -->
  <g stroke="#222228" stroke-width="1">
    <line x1="72" y1="360" x2="817" y2="360"/>
    <line x1="72" y1="279.5" x2="817" y2="279.5"/>
    <line x1="72" y1="199" x2="817" y2="199"/>
    <line x1="72" y1="118.5" x2="817" y2="118.5"/>
    <line x1="72" y1="38" x2="817" y2="38"/>
