  <text class="gain" style="fill: #FF681F;" x="593" y="87" text-anchor="middle">+0.8</text>
  <text class="total" x="593" y="72" text-anchor="middle">83.0</text>
  </g>

  <!-- Cross-model mean: 73.4 + 6.2 = 79.6 -->
  <rect x="683" y="171.4" width="58" height="188.6" fill="#272732" stroke="#3f3f4e" stroke-width="0.8"/>
